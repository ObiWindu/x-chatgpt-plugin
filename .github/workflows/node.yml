name: Node CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Verify package.json
        run: |
          pwd
          ls -la
          test -f package.json || {
            echo "ERROR: package.json is missing"
            exit 1
          }

      - name: Install dependencies
        run: npm install

      - name: Typecheck
        run: npm run typecheck
