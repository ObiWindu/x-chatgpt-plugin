id: x-chatgpt-publisher
name: X ChatGPT Publisher
description: ChatGPT Action service for publishing to an authenticated X account
components:
  volumes:
    - name: data
      plan: vol-1
  postgres: []
  mysql: []
  redis: []
  apps:
    - name: x-publisher
      plan: sa-1-1
      public: true
      replicas: 1
      httpPort: 3000
      healthCheckPath: /health
      domains: []
      deploymentSource:
        type: git
        git:
          url: https://github.com/YOUR_ORG/YOUR_REPO
          branch: main
          dockerfilepath: Dockerfile
      envVars:
        - name: PORT
          value: "3000"
        - name: DATABASE_PATH
          value: "/app/data/app.db"
        - name: COOKIE_SECURE
          value: "true"
      volumeMounts:
        - name: data
          mountPath: /app/data
